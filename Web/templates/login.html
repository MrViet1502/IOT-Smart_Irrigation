<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Smart Irrigation</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", sans-serif;
    background: url("/static/images/bk.png") no-repeat center center fixed;
    background-size: cover;
    position: relative;
    height: 100vh;
    color: #333;
}

/* Overlay */
body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(24, 34, 45, 0.7); /* Navy blue overlay */
    z-index: 1;
}

.login-container {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
}

.login-form {
    background-color: rgba(255, 255, 255, 0.85);  /* <-- Thay đổi ở đây */
    padding: 40px;
    border-radius: 12px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    color: #333;
    text-align: center;
}


.login-form h1 {
    color: #2e7d32;
    margin-bottom: 30px;
    font-size: 26px;
}

.login-form input[type="text"],
.login-form input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    margin: 12px 0 24px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    background-color: #fff;
    transition: border-color 0.3s ease;
}

.login-form input[type="text"]:focus,
.login-form input[type="password"]:focus {
    border-color: #2e7d32;
    outline: none;
}

.login-form button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    color: white;
    background-color: #2e7d32;  /* Green */
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.login-form button:hover {
    background-color: #27632a;
}

.login-form label {
    font-weight: bold;
    float: left;
}
</style>

</head>
<body>

<div class="login-container">
    <div class="login-form">
        <h1>Smart Irrigation Login</h1>
        <form action="/login" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}">
            
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>

            <button type="submit">Login</button>
        </form>
    </div>
</div>

</body>
</html>
